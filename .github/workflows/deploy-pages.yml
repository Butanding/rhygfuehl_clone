# Builds the site and publishes it to GitHub Pages as a test clone of rhygfuehl.ch.
# Prerequisite: Settings -> Pages -> Source = "GitHub Actions".
#
# The original does the same on Codeberg (a CI cron job every 15 minutes: fetch the data, build,
# deploy). GitHub's scheduler is only best effort and skips many runs, so it is asked every
# 5 minutes. A scheduled run is cheap: it fetches the data, compares a fingerprint (the newest
# time stamps) with the one published next to the site and ends right away if nothing is new.
# Only a run with new data (or a push) builds and publishes.
#
# Measurement data is generated on every run by our own data/aggregation.py.
# If the weather data has a hole (the MeteoSwiss files are updated with a delay, so right after
# midnight UTC a whole day can be missing) nothing is built or published: the site keeps its
# current version instead of showing a wrong rating. Any other error of the aggregation fails
# the run; the site also keeps its current version then.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # every 5 minutes (the shortest interval GitHub allows), not on the full and half hour,
    # which GitHub delays and skips most often
    - cron: '3-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      # Our own aggregation (data/aggregation.py) runs here, so the clone shows
      # the effect of our changes to the calculation.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - id: pages
        uses: actions/configure-pages@v5

      - name: Generate data with our aggregation
        id: aggregate
        run: |
          pip install -r data/requirements.txt
          set +e
          python data/aggregation.py
          code=$?
          set -e
          if [ "$code" = "3" ]; then
            echo "incomplete=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" != "0" ]; then exit "$code"; fi
          echo "{\"timestamp\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\", \"version\": \"$(git rev-parse --short HEAD)-$(date -u +'%Y%m%d-%H%M')\"}" > data/data/metadata.json

      # Nothing is published if the data has a hole, or (scheduled runs only) if the published
      # site already has the newest data. A push or a manual run always publishes.
      - name: Decide whether to publish
        id: decide
        run: |
          skip=false
          if [ "${{ steps.aggregate.outputs.incomplete }}" = "true" ]; then
            skip=true
            echo "::notice::The weather data is incomplete right now (the source files are updated with a delay after midnight UTC). Nothing is published, the site keeps its current version."
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            new=$(cat data/data/fingerprint.txt)
            old=$(curl -fsS --max-time 20 "${{ steps.pages.outputs.base_url }}/fingerprint.txt?t=$(date +%s)" || true)
            echo "data fingerprint: new='$new' published='$old'"
            if [ "$new" = "$old" ]; then
              skip=true
              echo "::notice::No newer data than the published site. Nothing to do."
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - if: steps.decide.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - if: steps.decide.outputs.skip != 'true'
        run: npm ci

      - name: Build
        if: steps.decide.outputs.skip != 'true'
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          PUBLIC_IS_CLONE: 'true'

      - name: Keep the clone out of search engines, publish the data fingerprint
        if: steps.decide.outputs.skip != 'true'
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
          rm -f dist/sitemap.xml dist/_redirects
          cp data/data/fingerprint.txt dist/fingerprint.txt

      - if: steps.decide.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
