# Builds the site and publishes it to GitHub Pages as a test clone of rhygfuehl.ch.
# Prerequisite: Settings -> Pages -> Source = "GitHub Actions".
# Measurement data is generated on every run by our own data/aggregation.py;
# the original's data files are only used as a fallback.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://codeberg.org/chric/rhygfuehl.git

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Our own aggregation (data/aggregation.py) runs here, so the clone shows
      # the effect of our changes to the calculation.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Generate data with our aggregation
        id: aggregate
        continue-on-error: true
        run: |
          pip install -r data/requirements.txt
          python data/aggregation.py
          echo "{\"timestamp\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\", \"version\": \"$(git rev-parse --short HEAD)-$(date -u +'%Y%m%d-%H%M')\"}" > data/data/metadata.json

      # Fallback if our aggregation fails (e.g. API outage): use the data of the original.
      - name: Fall back to data from upstream
        if: steps.aggregate.outcome == 'failure'
        run: |
          echo "::warning::Own aggregation failed, using the data files of the original repo"
          git fetch --depth=1 "$UPSTREAM_URL" main
          git checkout FETCH_HEAD -- data/data

      - id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          PUBLIC_IS_CLONE: 'true'

      - name: Keep the clone out of search engines
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
          rm -f dist/sitemap.xml dist/_redirects

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
