name: Main (Refresh Data & Deploy)

on:
  schedule:
    - cron: '8,23,38,53 * * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Run Tests
    if: github.event_name == 'push'
    uses: ./.forgejo/workflows/test.yml

  data-and-deploy:
    name: Data Aggregation & Deployment
    needs: [test]
    # Ensure this runs even if 'test' was skipped (e.g. on cron)
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: ./data/requirements.txt

      - name: Install Python dependencies
        run: pip install -r ./data/requirements.txt

      - name: Fetch data
        run: python ./data/aggregation.py

      - name: Generate metadata
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date -u +'%Y%m%d-%H%M')
          echo "{\"timestamp\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\", \"version\": \"$SHORT_SHA-$TIMESTAMP\"}" > data/data/metadata.json

      - name: Commit data changes
        run: |
          git config --global user.name "Forgejo Actions"
          git config --global user.email "actions@noreply.codeberg.org"
          git add data/data/*.json
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || git commit -m "cron data update [skip ci]"
          git push origin main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build

      - name: Deploy to Codeberg Pages
        env:
          CB_TOKEN: ${{ secrets.CB_TOKEN }}
        run: |
          git config --global user.name "Forgejo Actions"
          git config --global user.email "actions@noreply.codeberg.org"
          git clone --branch pages https://${CB_TOKEN}@codeberg.org/chric/rhygfuehl.git output
          rm -rf output/*
          cp -r dist/* output/
          cd output
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "Deploy pages from ${GITHUB_SHA}"
          git push origin pages
